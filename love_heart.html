<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#060208">
  <title>Love Heart ❤️</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #060208;
    }
    body { font-family: Arial, sans-serif; }
    canvas {
      display: block; width: 100vw; height: 100vh;
      background: #060208; touch-action: manipulation;
    }
  </style>
</head>
<body>
<canvas id="loveCanvas" aria-label="Un corazón animado formado por frases de amor"></canvas>
<script>
(() => {
  'use strict';

  const BG = '#060208';
  const FONT = 'Arial, sans-serif';
  const DURATION = 10000;
  const ANIM = 42 * 16;
  const LIFT = 34;
  const GAP = 7;
  const SIZES = [9, 10, 11, 12];
  const PHRASES = [
    'I love you', 'Seni seviyorum', 'Te amo', "Je t'aime",
    'Ich liebe dich', 'Ti amo', 'Eu te amo', 'Я тебя люблю',
    '사랑해', '愛してる', '我爱你', 'मैं तुमसे प्यार करता हूँ',
    "Σ' αγαπώ", 'Ik hou van jou', 'Jag älskar dig', 'Kocham cię',
    'ฉันรักเธอ', 'Anh yêu em', 'Aku cinta kamu', 'Я тебе кохаю'
  ];

  const canvas = document.getElementById('loveCanvas');
  const ctx = canvas.getContext('2d');
  let width = 0, height = 0, pixelRatio = 1;
  let items = [];
  let startedAt = 0;
  let nextShimmer = 0;
  let shimmerItem = null;
  let shimmerUntil = 0;
  let animationFrame = 0;

  // Seeded random generator, similar to random.Random(11) in the Python original.
  let seed = 11;
  function rand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function choice(list) { return list[Math.floor(rand() * list.length)]; }
  function clamp(value, min = 0, max = 1) { return Math.max(min, Math.min(max, value)); }
  function mix(a, b, k) { return a.map((v, i) => v + (b[i] - v) * k); }
  function dim(color, k) { return color.map(v => v * k); }
  function hexToRgb(hex) {
    return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  }
  function toHex(color) {
    return '#' + color.map(v => Math.round(clamp(v) * 255).toString(16).padStart(2, '0')).join('');
  }
  const BGC = hexToRgb(BG);
  const FLASH = [1.0, 0.78, 0.78];

  function heartPoint(a) {
    const x = 16 * Math.pow(Math.sin(a), 3);
    const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a)
            - 2 * Math.cos(3 * a) - Math.cos(4 * a);
    return { x, y };
  }

  function fontSize(size) { return `${size}px ${FONT}`; }

  function spansAt(y, polygon) {
    const xs = [];
    for (let i = 0; i < polygon.length; i++) {
      const a = polygon[i];
      const b = polygon[(i + 1) % polygon.length];
      if ((a.y <= y && y < b.y) || (b.y <= y && y < a.y)) {
        xs.push(a.x + (y - a.y) * (b.x - a.x) / (b.y - a.y));
      }
    }
    xs.sort((a, b) => a - b);
    const result = [];
    for (let i = 0; i + 1 < xs.length; i += 2) result.push([xs[i], xs[i + 1]]);
    return result;
  }

  function intersectSpans(a, b) {
    const out = [];
    for (const one of a) for (const two of b) {
      const lo = Math.max(one[0], two[0]);
      const hi = Math.min(one[1], two[1]);
      if (hi - lo > 14) out.push([lo, hi]);
    }
    return out;
  }

  function distanceFromCenter(x, y, cx, cy, scale) {
    return Math.min(1, Math.hypot((x - cx) / (16 * scale), (y - cy) / (14.5 * scale)));
  }

  function buildHeart() {
    seed = 11;
    items = [];
    ctx.font = `bold 12px ${FONT}`;

    const scale = Math.min((width * 0.84) / 32, (height * 0.66) / 30);
    const cx = width / 2;
    const cy = height * 0.51;
    const polygon = [];
    for (let i = 0; i < 720; i++) {
      const p = heartPoint(2 * Math.PI * i / 720);
      polygon.push({ x: cx + p.x * scale, y: cy - p.y * scale });
    }

    const ymin = Math.min(...polygon.map(p => p.y));
    const ymax = Math.max(...polygon.map(p => p.y));
    const rowH = 16;
    const half = rowH / 2;
    let y = ymin + half;
    let phraseIndex = 0;
    let order = PHRASES.slice();
    let orderIndex = 0;

    function nextPhrase() {
      if (orderIndex >= order.length) {
        order = PHRASES.slice();
        // Deterministic shuffle.
        for (let i = order.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
        orderIndex = 0;
      }
      return order[orderIndex++];
    }

    while (y < ymax - half) {
      const row = intersectSpans(spansAt(y - half, polygon), spansAt(y + half, polygon));
      for (const span of row) {
        const lo = span[0] + 4;
        const hi = span[1] - 4;
        let cur = lo + rand() * 8;
        const line = [];

        while (true) {
          let fit = null;
          for (let attempt = 0; attempt < 10; attempt++) {
            const text = nextPhrase();
            const size = choice(SIZES);
            ctx.font = `bold ${size}px ${FONT}`;
            const w = ctx.measureText(text).width;
            if (cur + w <= hi) { fit = { text, size, w }; break; }
          }
          if (!fit) break;
          line.push({ x: cur + fit.w / 2, y, text: fit.text, size: fit.size, w: fit.w });
          cur += fit.w + GAP;
          phraseIndex++;
        }

        if (!line.length) continue;
        if (line.length > 1) {
          const left = hi - (line[line.length - 1].x + line[line.length - 1].w / 2);
          line.forEach((item, i) => { item.x += left * i / (line.length - 1); });
        } else {
          line[0].x = (lo + hi) / 2;
        }

        line.forEach((item, i) => {
          item.edge = i === 0 || i === line.length - 1;
          item.rad = distanceFromCenter(item.x, item.y, cx, cy, scale);
          const wine = [0.58, 0.0, 0.09];
          const crimson = [0.90, 0.05, 0.14];
          const blood = [0.98, 0.10, 0.16];
          let color = mix(wine, crimson, 0.25 + 0.75 * item.rad);
          color = mix(color, blood, rand() * 0.35 + (item.edge ? 0.3 : 0));
          item.color = color.map(v => Math.min(1, v));
          item.dx = rand() * 20 - 10;
          items.push(item);
        });
      }
      y += rowH;
    }

    const edges = items.filter(p => p.edge);
    const inner = items.filter(p => !p.edge);
    edges.sort((a, b) => (Math.atan2(a.x - cx, a.y - cy) % (2 * Math.PI)) - (Math.atan2(b.x - cx, b.y - cy) % (2 * Math.PI)));
    inner.sort((a, b) => (b.rad - rand() * 0.08) - (a.rad - rand() * 0.08));
    items = edges.concat(inner);
    items.forEach((item, i) => { item.delay = items.length > 1 ? i / (items.length - 1) * DURATION : 0; });
  }

  function drawText(text, x, y, size, color, shadow = false) {
    ctx.font = `bold ${size}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (shadow) {
      ctx.fillStyle = color;
      ctx.fillText(text, x + 2, y + 3);
    } else {
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
    }
  }

  function render(now) {
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, width, height);
    const elapsed = now - startedAt;

    if (elapsed >= DURATION && now >= nextShimmer) {
      if (items.length) {
        shimmerItem = choice(items);
        shimmerUntil = now + 260;
      }
      nextShimmer = now + 140;
    }

    for (const p of items) {
      const progress = clamp((elapsed - p.delay) / ANIM);
      if (progress <= 0) continue;
      const eased = 1 - Math.pow(1 - progress, 3);
      const x = p.x + p.dx * (1 - eased);
      const y = p.y - (1 - eased) * LIFT;
      const c = p.color;

      drawText(p.text, x, y, p.size, toHex(mix(BGC, dim(c, 0.30), eased)), true);
      drawText(p.text, x, y, p.size + 1, toHex(mix(BGC, dim(c, 0.20), eased * eased)));

      let flash = 0;
      if (p === shimmerItem && now < shimmerUntil) flash = 0.6;
      else {
        flash = 0.75 * Math.sin(Math.PI * clamp((progress - 0.55) / 0.45));
      }
      const base = mix(BGC, c, Math.pow(eased, 1.5));
      drawText(p.text, x, y, p.size, toHex(mix(base, FLASH, flash)));
    }

    animationFrame = requestAnimationFrame(render);
  }

  function resize() {
    if (animationFrame) cancelAnimationFrame(animationFrame);
    pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    buildHeart();
    startedAt = performance.now();
    nextShimmer = startedAt + DURATION + ANIM;
    shimmerItem = null;
    animationFrame = requestAnimationFrame(render);
  }

  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
